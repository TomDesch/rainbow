name: Verify

'on':
  push:

  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify

      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp clean verify

      - name: Inspect packaged artifact on Windows
        if: runner.os == 'Windows'
        run: python .github\scripts\verify_artifact.py && python -m unittest discover -s .github\scripts -p test_verify_artifact.py

      - name: Inspect packaged artifact on Linux
        if: runner.os != 'Windows'
        run: python3 .github/scripts/verify_artifact.py && python3 -m unittest discover -s .github/scripts -p test_verify_artifact.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rainbow-${{ matrix.os }}
          path: target/Rainbow-4.0.0.jar
          if-no-files-found: error
          retention-days: 7
